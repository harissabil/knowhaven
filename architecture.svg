  <!-- ORTHOGONAL CONNECTORS & FLOW ARROWS -->
  <!-- ========================================================= -->
  <path d="M186 162 L212 162 L212 225 L238 225" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrSlate)"/>
  <path d="M186 307 L212 307 L212 265 L238 265" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrSlate)"/>
  <path d="M336 220 L350 220 L350 130 L362 130" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrSlate)"/>
