<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Inter', 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrSlate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" fill="#FFFFFF" rx="10"/>
  <rect x="1" y="1" width="1098" height="578" rx="9" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="24" y="30" fill="#0F172A" font-size="15" font-weight="700" letter-spacing="-0.3">
    The Workplace Brain (Knowhaven) — System Architecture
  </text>
  <text x="24" y="47" fill="#64748B" font-size="10.5">
    Two Entry Points · Single Permission-Enforcing Backend · Pre-Search SQL RBAC · Force RLS · Human-in-the-Loop Gate
  </text>

  <!-- ========================================================= -->
  <!-- ZONE 1: CLIENTS (LEFT) -->
  <!-- ========================================================= -->
  <rect x="20" y="66" width="180" height="464" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="20" y="66" width="108" height="20" rx="4" fill="#475569"/>
  <text x="74" y="79.5" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">CLIENT ZONE</text>

  <!-- Card: WorkBuddy Desktop -->
  <g transform="translate(34, 120)" filter="url(#cardShadow)">
    <rect width="152" height="84" rx="7" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="12" y="14" width="32" height="32" rx="6" fill="#EEF2FF"/>
    <rect x="18" y="20" width="20" height="14" rx="2" fill="none" stroke="#4F46E5" stroke-width="1.8"/>
    <line x1="23" y1="38" x2="33" y2="38" stroke="#4F46E5" stroke-width="1.8"/>
    <text x="52" y="27" fill="#0F172A" font-size="11" font-weight="700">WorkBuddy</text>
    <text x="52" y="40" fill="#4F46E5" font-size="9.5" font-weight="600">MCP Client</text>
    <text x="12" y="62" fill="#64748B" font-size="8.5">Bearer wbk_... Token</text>
    <text x="12" y="74" fill="#64748B" font-size="8.5">Read / Ask Tools Only</text>
  </g>

  <!-- Card: Next.js Web App -->
  <g transform="translate(34, 265)" filter="url(#cardShadow)">
    <rect width="152" height="84" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="12" y="14" width="32" height="32" rx="6" fill="#E0F2FE"/>
    <rect x="18" y="20" width="20" height="16" rx="2" fill="none" stroke="#0284C7" stroke-width="1.8"/>
    <line x1="18" y1="25" x2="38" y2="25" stroke="#0284C7" stroke-width="1.5"/>
    <text x="52" y="27" fill="#0F172A" font-size="11" font-weight="700">Next.js 16 Web</text>
    <text x="52" y="40" fill="#0284C7" font-size="9.5" font-weight="600">Browser UI</text>
    <text x="12" y="62" fill="#64748B" font-size="8.5">Chat SSE · @Doc Tag</text>
    <text x="12" y="74" fill="#64748B" font-size="8.5">Approvals · RBAC · Audit</text>
  </g>

  <!-- Card: Human Manager / Auditor -->
  <g transform="translate(34, 410)" filter="url(#cardShadow)">
    <rect width="152" height="76" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="14" width="32" height="32" rx="6" fill="#ECFDF5"/>
    <circle cx="26" cy="25" r="4.5" fill="none" stroke="#059669" stroke-width="1.8"/>
    <path d="M18 38 C18 33, 34 33, 34 38" fill="none" stroke="#059669" stroke-width="1.8"/>
    <text x="52" y="27" fill="#0F172A" font-size="11" font-weight="700">Manager / Admin</text>
    <text x="52" y="40" fill="#059669" font-size="9.5" font-weight="600">Human Approver</text>
    <text x="12" y="62" fill="#64748B" font-size="8.5">Approves SOP Diffs &amp; Grants</text>
  </g>

  <!-- ========================================================= -->
  <!-- ZONE 2: TENCENT CLOUD LIGHTHOUSE (APPLICATION VPC) -->
  <!-- ========================================================= -->
  <rect x="224" y="66" width="528" height="464" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="224" y="66" width="250" height="20" rx="4" fill="#1D4ED8"/>
  <text x="349" y="79.5" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    TENCENT CLOUD LIGHTHOUSE · DOCKER VPC
  </text>

  <!-- Ingress: Caddy Reverse Proxy -->
  <g transform="translate(240, 185)" filter="url(#cardShadow)">
    <rect width="96" height="130" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect x="32" y="16" width="32" height="32" rx="6" fill="#1E293B"/>
    <rect x="41" y="28" width="14" height="11" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <path d="M44 28 V24 A4 4 0 0 1 52 24 V28" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="48" y="66" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Caddy 2</text>
    <text x="48" y="80" fill="#38BDF8" font-size="9" font-weight="600" text-anchor="middle">Reverse Proxy</text>
    <text x="48" y="98" fill="#94A3B8" font-size="8" text-anchor="middle">Auto-TLS :443</text>
    <text x="48" y="111" fill="#94A3B8" font-size="8" text-anchor="middle">/mcp · /api · /</text>
  </g>

  <!-- Service: Stateless MCP Server (:8001) -->
  <g transform="translate(364, 96)" filter="url(#cardShadow)">
    <rect width="170" height="68" rx="7" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#EEF2FF"/>
    <circle cx="26" cy="26" r="7" fill="none" stroke="#4F46E5" stroke-width="1.8"/>
    <circle cx="26" y="26" r="2.5" fill="#4F46E5"/>
    <text x="48" y="24" fill="#0F172A" font-size="10.5" font-weight="700">MCP Server (:8001)</text>
    <text x="48" y="37" fill="#4F46E5" font-size="9" font-weight="600">Stateless Gateway</text>
    <text x="12" y="55" fill="#64748B" font-size="8.5">Fresh DB Role Lookup per Call</text>
  </g>

  <!-- Core Box: FastAPI Engine & 8-Step Pipeline (:8000) -->
  <g transform="translate(364, 182)" filter="url(#cardShadow)">
    <rect width="368" height="214" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect width="368" height="28" rx="7" fill="#EFF6FF"/>
    <text x="14" y="18" fill="#1D4ED8" font-size="11" font-weight="700">
      ⚡ FastAPI Core &amp; 8-Step Pipeline (:8000)
    </text>
    <text x="354" y="18" fill="#475569" font-size="8.5" font-weight="600" text-anchor="end">
      "Code Decides, LLM Explains"
    </text>

    <!-- Stage 1 -->
    <rect x="14" y="40" width="162" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="22" y="48" width="18" height="18" rx="4" fill="#1D4ED8"/>
    <text x="31" y="60.5" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">1</text>
    <text x="46" y="60" fill="#0F172A" font-size="10" font-weight="700">Identity &amp; Policy Gate</text>
    <text x="22" y="78" fill="#475569" font-size="8.5">SET LOCAL app.tenant_id</text>
    <text x="22" y="91" fill="#475569" font-size="8.5">Understand + Salary/Write Refusal</text>

    <!-- Stage 2 -->
    <rect x="192" y="40" width="162" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="200" y="48" width="18" height="18" rx="4" fill="#1D4ED8"/>
    <text x="209" y="60.5" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">2</text>
    <text x="224" y="60" fill="#0F172A" font-size="10" font-weight="700">Hybrid Retrieval</text>
    <text x="200" y="78" fill="#475569" font-size="8.5">SQL vis CTE Pre-Filter</text>
    <text x="200" y="91" fill="#475569" font-size="8.5">Agno Read-Only Planner</text>

    <!-- Stage 3 -->
    <rect x="14" y="126" width="162" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="22" y="134" width="18" height="18" rx="4" fill="#1D4ED8"/>
    <text x="31" y="146.5" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">3</text>
    <text x="46" y="146" fill="#0F172A" font-size="10" font-weight="700">Conflict &amp; Zero-Leak IDK</text>
    <text x="22" y="164" fill="#475569" font-size="8.5">Authority &gt; Recency · Tie Rule</text>
    <text x="22" y="177" fill="#475569" font-size="8.5">Deterministic IDK (T01 == T02)</text>

    <!-- Stage 4 -->
    <rect x="192" y="126" width="162" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="200" y="134" width="18" height="18" rx="4" fill="#1D4ED8"/>
    <text x="209" y="146.5" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">4</text>
    <text x="224" y="146" fill="#0F172A" font-size="10" font-weight="700">Validate &amp; Audit</text>
    <text x="200" y="164" fill="#475569" font-size="8.5">Citation, Number &amp; PII Guard</text>
    <text x="200" y="177" fill="#475569" font-size="8.5">SHA-256 Hash-Chained Log</text>

    <!-- Internal Stage Flow Arrows -->
    <line x1="176" y1="76" x2="190" y2="76" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrBlue)"/>
    <path d="M273 112 L273 119 L95 119 L95 124" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrBlue)"/>
    <line x1="176" y1="162" x2="190" y2="162" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrBlue)"/>
  </g>

  <!-- Bottom-Left inside VPC: HITL Execution Gate -->
  <g transform="translate(364, 416)" filter="url(#cardShadow)">
    <rect width="176" height="94" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#ECFDF5"/>
    <path d="M20 26 L25 31 L34 21" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="46" y="24" fill="#0F172A" font-size="10.5" font-weight="700">HITL Gate</text>
    <text x="46" y="37" fill="#059669" font-size="9" font-weight="600">Write Isolation</text>
    <text x="12" y="57" fill="#64748B" font-size="8.5">• ActionDraft SOP Diff</text>
    <text x="12" y="70" fill="#64748B" font-size="8.5">• AccessRequest TempGrant</text>
    <text x="12" y="83" fill="#059669" font-size="8" font-weight="700">Only holder of write keys</text>
  </g>

  <!-- Bottom-Right inside VPC: Ingestion & Sync Worker -->
  <g transform="translate(556, 416)" filter="url(#cardShadow)">
    <rect width="176" height="94" rx="7" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#E0F2FE"/>
    <path d="M21 26 A6 6 0 1 1 31 30" fill="none" stroke="#0284C7" stroke-width="1.8"/>
    <polygon points="31 26, 35 31, 28 31" fill="#0284C7"/>
    <text x="46" y="24" fill="#0F172A" font-size="10.5" font-weight="700">Ingestion &amp; Worker</text>
    <text x="46" y="37" fill="#0284C7" font-size="9" font-weight="600">Live Sync + Safety</text>
    <text x="12" y="57" fill="#64748B" font-size="8.5">• Default-Deny (mapped=false)</text>
    <text x="12" y="70" fill="#64748B" font-size="8.5">• Pre-LLM PII Masking</text>
    <text x="12" y="83" fill="#64748B" font-size="8.5">• Prompt Injection Flagging</text>
  </g>

  <!-- ========================================================= -->
  <!-- ZONE 3: DATA, AI & EXTERNAL SERVICES (RIGHT) -->
  <!-- ========================================================= -->

  <!-- Sub-Zone 3A: Managed Data & Storage -->
  <rect x="776" y="66" width="304" height="206" rx="8" fill="#EFF6FF" fill-opacity="0.45" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="776" y="66" width="196" height="20" rx="4" fill="#1E40AF"/>
  <text x="874" y="79.5" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    DATA ISOLATION BOUNDARY
  </text>

  <!-- Card: Lakebase PostgreSQL (Neon) -->
  <g transform="translate(792, 96)" filter="url(#cardShadow)">
    <rect width="272" height="86" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="12" y="14" width="34" height="34" rx="6" fill="#DBEAFE"/>
    <ellipse cx="29" cy="23" rx="9" ry="3.5" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
    <path d="M20 23 V37 C20 39, 38 39, 38 37 V23" fill="none" stroke="#1D4ED8" stroke-width="1.8"/>
    <text x="56" y="26" fill="#0F172A" font-size="11" font-weight="700">Lakebase PostgreSQL (Neon)</text>
    <text x="56" y="39" fill="#1D4ED8" font-size="9" font-weight="600">FORCE ROW LEVEL SECURITY (brain_app)</text>
    <text x="12" y="60" fill="#475569" font-size="8.5">• Hybrid RRF: pgvector(768) + FTS + pg_trgm</text>
    <text x="12" y="73" fill="#475569" font-size="8.5">• Append-Only Audit Log (INSERT/SELECT only)</text>
  </g>

  <!-- Card: S3 Object Storage -->
  <g transform="translate(792, 194)" filter="url(#cardShadow)">
    <rect width="272" height="64" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="12" y="14" width="34" height="34" rx="6" fill="#F3E8FF"/>
    <polygon points="21 22, 37 22, 35 39, 23 39" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="56" y="27" fill="#0F172A" font-size="11" font-weight="700">S3 Object Storage</text>
    <text x="56" y="40" fill="#7C3AED" font-size="9" font-weight="600">tenants/&lt;tenant_id&gt;/... Prefix</text>
    <text x="56" y="53" fill="#64748B" font-size="8.5">Presigned URL gated by RBAC + PII rights</text>
  </g>

  <!-- Sub-Zone 3B: Cross-Cloud AI Boundary -->
  <rect x="776" y="286" width="304" height="106" rx="8" fill="#FFFBEB" fill-opacity="0.55" stroke="#D97706" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="776" y="286" width="196" height="20" rx="4" fill="#B45309"/>
  <text x="874" y="299.5" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    CROSS-CLOUD AI BOUNDARY
  </text>

  <!-- Card: Google Gemini (Vertex AI) -->
  <g transform="translate(792, 314)" filter="url(#cardShadow)">
    <rect width="272" height="66" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="12" y="14" width="34" height="34" rx="6" fill="#FEF3C7"/>
    <path d="M29 19 L31.5 26.5 L39 29 L31.5 31.5 L29 39 L26.5 31.5 L19 29 L26.5 26.5 Z" fill="none" stroke="#D97706" stroke-width="1.6"/>
    <text x="56" y="26" fill="#0F172A" font-size="11" font-weight="700">Google Gemini (Vertex AI)</text>
    <text x="56" y="39" fill="#B45309" font-size="9" font-weight="600">3.5-Lite · 3.6-Flash · 3.7-Flash · Embed-001</text>
    <text x="56" y="53" fill="#64748B" font-size="8.5">Receives RBAC-Filtered &amp; PII-Masked Text Only</text>
  </g>

  <!-- Sub-Zone 3C: External Workplace Sources -->
  <rect x="776" y="406" width="304" height="124" rx="8" fill="#ECFDF5" fill-opacity="0.45" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="776" y="406" width="196" height="20" rx="4" fill="#047857"/>
  <text x="874" y="419.5" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    EXTERNAL WORKPLACE SOURCES
  </text>

  <!-- Card: Slack, Confluence, Jira, WhatsApp -->
  <g transform="translate(792, 434)" filter="url(#cardShadow)">
    <rect width="272" height="82" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="14" width="34" height="34" rx="6" fill="#D1FAE5"/>
    <circle cx="24" cy="26" r="3.5" fill="#059669"/>
    <circle cx="34" cy="36" r="3.5" fill="#059669"/>
    <line x1="26.5" y1="28.5" x2="31.5" y2="33.5" stroke="#059669" stroke-width="1.8"/>
    <text x="56" y="26" fill="#0F172A" font-size="11" font-weight="700">Slack · Confluence · Jira · Docs</text>
    <text x="56" y="39" fill="#059669" font-size="9" font-weight="600">Encrypted Per-Tenant Credentials</text>
    <text x="12" y="58" fill="#475569" font-size="8.5">• Slack Events HMAC Webhook + JSON Import</text>
    <text x="12" y="71" fill="#475569" font-size="8.5">• Confluence/Jira Poll + HITL-Only Page Update</text>
  </g>

