  <line x1="186" y1="455" x2="362" y2="455" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrGreen)"/>
  <line x1="452" y1="396" x2="452" y2="414" stroke="#059669" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M732 215 L760 215 L760 139 L790 139" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="732" y1="226" x2="790" y2="226" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrPurple)"/>
  <line x1="732" y1="347" x2="790" y2="347" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <line x1="792" y1="475" x2="734" y2="475" stroke="#059669" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M644 416 L644 405 L768 405 L768 160 L790 160" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrBlue)"/>
  <path d="M452 510 L452 522 L928 522 L928 518" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrGreen)"/>

