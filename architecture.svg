  <!-- ========================================================= -->
  <line x1="20" y1="544" x2="1080" y2="544" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(24, 556)" font-size="9.5" fill="#475569" font-weight="600">
    <rect x="0" y="2" width="14" height="9" rx="2" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="20" y="10">Trust / Isolation Boundary</text>
    <circle cx="178" cy="6.5" r="4" fill="#2563EB"/>
    <text x="188" y="10">Core Pipeline &amp; Postgres RLS</text>
    <circle cx="358" cy="6.5" r="4" fill="#6366F1"/>
    <text x="368" y="10">WorkBuddy MCP</text>
    <circle cx="478" cy="6.5" r="4" fill="#059669"/>
    <text x="488" y="10">HITL Approval &amp; Connectors</text>
    <circle cx="655" cy="6.5" r="4" fill="#D97706"/>
    <text x="665" y="10">Gemini (Masked Context Only)</text>
    <circle cx="842" cy="6.5" r="4" fill="#7C3AED"/>
