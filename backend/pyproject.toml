[project]
name = "brain"
version = "0.1.0"
description = "Workplace Brain backend: permission-aware company knowledge assistant"
readme = "README.md"
authors = [
    { name = "Muhammad Haris Sabil Al Karim", email = "97924751+harissabil@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.10",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.118",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "slack-sdk>=3.45.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
brain = "brain:main"
brain-db-bootstrap = "brain.db.bootstrap:main"
brain-seed = "brain.seed:main"
brain-mcp = "brain.mcp_server.server:main"
brain-mcp-token = "brain.mcp_server.token_cli:main"
brain-worker = "brain.worker:main"
brain-slack-demo = "brain.integrations.slack_demo:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run: the cached async engine must not outlive its event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (skip with -m 'not live')"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"tests/*" = ["E501"]  # fixtures are clearer on one line
"src/brain/seed.py" = ["E501"]
"src/brain/policy/*" = ["E501"]  # user-facing templates read better unwrapped
"src/brain/agent/*" = ["E501"]
"src/brain/api/chat.py" = ["E501"]
"src/brain/api/documents.py" = ["E501"]
"src/brain/api/uploads.py" = ["E501"]
"src/brain/api/integrations.py" = ["E501"]
"src/brain/integrations/*" = ["E501"]
"src/brain/api/audit.py" = ["E501"]
"src/brain/mcp_server/*" = ["E501"]
"src/brain/api/mcp_tokens.py" = ["E501"]  # user-facing instruction text
"src/brain/hitl/*" = ["E501"]
